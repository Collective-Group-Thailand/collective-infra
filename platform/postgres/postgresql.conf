# PostgreSQL 18 — shared instance for getpack / getproperty / getbuild on a 16 GB box with a 4 GB container limit.
# Tuned for OLTP + light TimescaleDB ingest; adjust POSTGRES_MEMORY_LIMIT and these together.

listen_addresses = '*'
port = 5432
max_connections = 120                 # 3 products × (api pool 15 + worker pool 10) + headroom; apps MUST pool
hba_file = '/etc/postgresql/pg_hba.conf'

# --- memory (container limit 4 GB) ---
shared_buffers = 1GB
effective_cache_size = 2560MB
work_mem = 8MB
maintenance_work_mem = 256MB
huge_pages = off

# --- WAL / checkpoints / archiving (pgBackRest) ---
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=collective archive-push %p'
archive_timeout = 300                 # bound RPO to 5 min even when idle
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
wal_compression = zstd

# --- planner / IO (gp3 SSD) ---
random_page_cost = 1.1
effective_io_concurrency = 200
io_method = worker                    # PG18 async IO
io_workers = 3

# --- extensions ---
shared_preload_libraries = 'timescaledb,pg_stat_statements'
timescaledb.max_background_workers = 8
max_worker_processes = 16
pg_stat_statements.track = top

# --- logging (stderr → docker json-file → Alloy → Loki; jsonlog needs the collector, which hides logs from docker) ---
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500      # slow queries ≥ 500 ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 10s
log_line_prefix = '%m [%p] %q%u@%d '

# --- autovacuum (small instance, keep it eager) ---
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_naptime = 30s

timezone = 'Asia/Bangkok'
lc_messages = 'C'
