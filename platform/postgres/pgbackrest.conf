# pgBackRest inside the timescaledb-ha container. Repo = S3, credentials from the instance role (IMDS).
# Bucket / region / endpoint are env-specific and come from container env vars
# (PGBACKREST_REPO1_S3_BUCKET, PGBACKREST_REPO1_S3_REGION, PGBACKREST_REPO1_S3_ENDPOINT — see docker-compose.yml).

[global]
repo1-type=s3
repo1-s3-key-type=auto
repo1-s3-uri-style=path
repo1-retention-full=4            # 4 weekly fulls ≈ 28 days + WAL → ~35 days PITR with bucket lifecycle
repo1-retention-full-type=count
repo1-retention-archive-type=full
repo1-retention-archive=4
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=off
delta=y

[collective]
pg1-path=/home/postgres/pgdata/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
