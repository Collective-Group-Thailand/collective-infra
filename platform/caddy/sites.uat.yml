# Hostnames per product for UAT. bin/render-sites.sh → caddy/sites/<product>.caddy
getpack:
  WEB_HOST: uat.getpack.co
  API_HOST: uat-api.getpack.co
  ADMIN_HOST: admin-uat.getpack.co     # getpack-web admin zone (staff console)
  PARTNER_HOST: partner-uat.getpack.co # getpack-web partner zone (factories)
getproperty: # owner console, staff PWA, admin, LIFF, API, gateways (mTLS), MQTT broker
  OWNER_HOST: uat-app.getproperty.app
  STAFF_HOST: uat-staff.getproperty.app
  ADMIN_HOST: uat-admin.getproperty.app
  LIFF_HOST: uat-liff.getproperty.app
  API_HOST: uat-api.getproperty.app
  DEVICE_HOST: uat-device.getproperty.app
  MQTT_HOST: uat-mqtt.getproperty.app
getbuild:
  WEB_HOST: uat.getbuild.example # TODO domain
  API_HOST: uat-api.getbuild.example
