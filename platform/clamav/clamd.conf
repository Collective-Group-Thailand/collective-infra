# clamd for the Collective platform (official clamav/clamav image; mounted over /etc/clamav/clamd.conf).
# Apps scan uploads over INSTREAM on clamav:3310 (getpack-api ClamdScanner, CLAMAV_HOST=clamav).
Foreground yes
LogTime yes
LogClean no
LogVerbose no
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
MaxThreads 4
# Apps send at most 512 MiB per object (getpack-api CLAMAV_MAX_BYTES); keep these above that.
StreamMaxLength 520M
MaxScanSize 1024M
MaxFileSize 520M
# Reload signatures in place: one engine in memory (~1.2 GB) instead of two during freshclam updates;
# scans wait a few seconds during a reload and the apps retry.
ConcurrentDatabaseReload no
