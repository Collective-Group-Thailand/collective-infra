# clamd of the shared platform `clamav` service (platform/docker-compose.yml). Replaces the image's default
# /etc/clamav/clamd.conf, so it keeps the settings the clamav/clamav-debian entrypoint relies on (LocalSocket the init
# waits for, TCPSocket 3310 that clamdcheck.sh pings). UNVERIFIED against a running container (no Docker here).
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
PidFile /tmp/clamd.pid
Foreground yes
LogFile /var/log/clamav/clamd.log
LogTime yes
LogFileMaxSize 5M
LogRotate yes

# Memory: one database in RAM (no second copy while reloading) — the platform budget counts 1,152 MB for this service.
ConcurrentDatabaseReload no
ExitOnOOM yes
SelfCheck 3600

# INSTREAM limits: product APIs stream uploads (slips, photos, ID documents, PDFs; getproperty's API body ceiling is
# 32 MB) — larger streams are refused with "INSTREAM size limit exceeded", which the products treat as a failed scan.
StreamMaxLength 40M
MaxFileSize 40M
MaxScanSize 100M
MaxThreads 4
MaxConnectionQueueLength 30
ReadTimeout 120
CommandReadTimeout 30
