# clamd of the shared platform `clamav` service (clamav/clamav-debian; mounted over /etc/clamav/clamd.conf).
# Products scan uploads over INSTREAM on clamav:3310 (getpack-api ClamdScanner, getproperty-api scan provider).
# Keeps what the image entrypoint relies on: LocalSocket (the init waits for it), TCPSocket 3310 (healthcheck ping).
Foreground yes
LogTime yes
LogClean no
LogVerbose no
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
PidFile /tmp/clamd.pid
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav

# Memory: one signature engine in RAM (~1.2 GB) — no second copy while freshclam reloads; scans wait a few
# seconds during a reload and the products retry.
ConcurrentDatabaseReload no
ExitOnOOM yes
SelfCheck 3600

# INSTREAM limits. getpack sends at most 512 MiB per object (CLAMAV_MAX_BYTES; artwork up to 2 GB is scanned up to
# there); getproperty's API body ceiling is 32 MB. Keep StreamMaxLength above the largest product cap.
StreamMaxLength 520M
MaxFileSize 520M
MaxScanSize 1024M
MaxThreads 4
MaxConnectionQueueLength 30
ReadTimeout 120
CommandReadTimeout 30
