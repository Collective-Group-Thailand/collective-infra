# Shared platform services for one Collective box. Products attach to the `collective` network
# and are deployed as separate compose projects (platform/products/<product>/docker-compose.yml).
#
#   docker compose --env-file /etc/collective/platform.env --env-file env/<env>.env --env-file /run/collective/platform.secrets.env up -d
#   (bin/lib.sh compose_platform does exactly this)
#
# Memory limits are the contract that lets three products share 16 GB (PLAN.md). Keep them.
# Platform budget ≈ 6 GB (locked 2026-10-21) = caddy 256M · postgres 3,328M · valkey 512M · emqx 512M · alloy 384M ·
# clamav 1,152M = 6,144 MB. POSTGRES_MEMORY_LIMIT / CLAMAV_MEMORY_LIMIT are per-env knobs (platform/env/<env>.env).
name: platform

networks:
  collective:
    name: collective
    driver: bridge

services:
  # ------------------------------------------------------------------ ingress
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      COLLECTIVE_ENV: ${COLLECTIVE_ENV}
      PLATFORM_HOSTNAME: ${PLATFORM_HOSTNAME}
      ACME_EMAIL: ${CADDY_ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro
      - /data/caddy:/data
    networks: [collective]
    deploy:
      resources:
        limits: { memory: 256M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options: { tag: "platform/caddy" }

  # ------------------------------------------------------------------ database
  # timescaledb-ha ships PostgreSQL 18 + TimescaleDB + pgvector + pgBackRest in one image.
  postgres:
    image: timescale/timescaledb-ha:pg18
    restart: unless-stopped
    user: "1000:1000"
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PGDATA: /home/postgres/pgdata/data
      # product role passwords consumed by postgres/init/10-products.sh on first start
      GETPACK_DB_PASSWORD: ${GETPACK_DB_PASSWORD}
      GETPROPERTY_DB_PASSWORD: ${GETPROPERTY_DB_PASSWORD}
      GETPOP_DB_PASSWORD: ${GETPOP_DB_PASSWORD}
      # pgBackRest → S3 via instance role (no keys). IMDSv2 hop limit is 2 so containers can reach it.
      PGBACKREST_STANZA: collective
      PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_BUCKET}
      PGBACKREST_REPO1_S3_REGION: ${AWS_REGION}
      PGBACKREST_REPO1_S3_ENDPOINT: s3.${AWS_REGION}.amazonaws.com
      PGBACKREST_REPO1_PATH: /pgbackrest/${COLLECTIVE_ENV}
      COLLECTIVE_ENV: ${COLLECTIVE_ENV}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - /data/postgres:/home/postgres/pgdata
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - /data/pgbackrest-spool:/var/spool/pgbackrest
    networks: [collective]
    expose: ["5432"]
    deploy:
      resources:
        limits: { memory: "${POSTGRES_MEMORY_LIMIT:-3328m}" } # shared_buffers 1GB (postgresql.conf)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      options: { tag: "platform/postgres" }

  # ------------------------------------------------------------------ queue / cache
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD}
      - --databases
      - "16" # 0–14 one per product, 15 = shared platform queues (pdf-render) — bin/lib.sh PLATFORM_QUEUES_VALKEY_DB
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-384mb}
      - --maxmemory-policy
      - noeviction # BullMQ must never lose jobs; apps cache with TTLs instead
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes:
      - /data/valkey:/data
    networks: [collective]
    expose: ["6379"]
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$VALKEY_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    logging:
      options: { tag: "platform/valkey" }

  # ------------------------------------------------------------------ MQTT (shared broker)
  # EMQX is the platform broker (getproperty-api D-235). Listeners:
  #  - ssl:default 8883, PUBLIC — IoT gateways, mutual TLS against the platform device CA (bin/render-device-ca.sh,
  #    collective/<env>/platform/device-ca); the server certificate comes from the same CA because gateways trust only
  #    the caChainPem of their bootstrap (not Let's Encrypt). Zone `devices`: the certificate CN (gw-<gatewayId>)
  #    becomes username and client id. Authentication: HTTP → getproperty-api, CN + device JWT as password.
  #  - tcp:default 1883, INTERNAL (docker network only, never published) — product services; password users from the
  #    built-in database (getproperty's MQTT_USERNAME via products/getproperty/hooks/post-secrets.sh).
  #  - ws:default 8083, INTERNAL, public only through Caddy as wss://<MQTT_HOST>/mqtt (device-CA broker certificate)
  #    — the WSS fallback for buildings that block 8883 (getproperty O-012, resolved 2026-10-21 as recommended): no
  #    client certificate on this path, the gateway is authenticated by its device JWT alone (≤ 1 h, issued only over
  #    mTLS to a non-retired gateway). The HTTP body says which path (`transport` "mtls" | "ws").
  # Authorization: file (platform-wide denies, emqx/platform-acl.conf) → HTTP getproperty-api (`gp/v1/#` is
  # getproperty's namespace; it answers "ignore" for anything else) → no_match = deny, deny_action = disconnect.
  # The HTTP calls carry x-emqx-auth-token (GETPROPERTY_EMQX_AUTH_TOKEN ← platform/emqx `getproperty_auth_token`);
  # /internal/* is docker-network only and Caddy answers 404 for it on every public host. With the API down the
  # hooks fail closed (a failed call counts as "ignore", so no authenticator allows): gateways keep their readings
  # (store-and-forward) and reconnect with back-off. Body field names are those of getproperty-api's
  # EmqxAuthnRequest / EmqxAuthzRequest (src/core/devices/emqx-auth.service.ts, checked against 74bdcdc): authn
  # transport, clientid, username, password, cert_common_name, cert_subject, peerhost; authz username, clientid,
  # topic, action, qos, retain, peerhost. Env values in HOCON (listener chains, sources) — UNVERIFIED against a
  # running EMQX 5.8 (no Docker here).
  emqx:
    image: emqx/emqx:5.8
    restart: unless-stopped
    ports:
      - "8883:8883"
    environment:
      EMQX_NODE__NAME: emqx@emqx.collective
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      EMQX_MQTT__MAX_PACKET_SIZE: 1MB # ≥ 256 KB for 200-reading telemetry batches
      EMQX_LISTENERS__TCP__DEFAULT__BIND: "0.0.0.0:1883" # containers only (not published)
      EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/data/certs/device/server.pem
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/data/certs/device/server.key
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: /opt/emqx/data/certs/device/ca.pem
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: verify_peer
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "true"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERSIONS: '["tlsv1.3","tlsv1.2"]'
      EMQX_LISTENERS__SSL__DEFAULT__ZONE: devices
      EMQX_ZONES__DEVICES__MQTT__PEER_CERT_AS_USERNAME: cn
      EMQX_ZONES__DEVICES__MQTT__PEER_CERT_AS_CLIENTID: cn
      EMQX_LISTENERS__SSL__DEFAULT__ENABLE_AUTHN: "true"
      EMQX_LISTENERS__SSL__DEFAULT__AUTHENTICATION: >-
        [{mechanism = password_based, backend = http, method = post,
          url = "http://getproperty-api:3000/internal/emqx/authn",
          headers {"content-type" = "application/json", "x-emqx-auth-token" = "${GETPROPERTY_EMQX_AUTH_TOKEN:-}"},
          body {transport = "mtls", clientid = "$${clientid}", username = "$${username}", password = "$${password}",
                cert_common_name = "$${cert_common_name}", cert_subject = "$${cert_subject}", peerhost = "$${peerhost}"},
          request_timeout = "5s", pool_size = 8}]
      EMQX_LISTENERS__WS__DEFAULT__BIND: "0.0.0.0:8083"
      EMQX_LISTENERS__WS__DEFAULT__ENABLE_AUTHN: "true"
      EMQX_LISTENERS__WS__DEFAULT__AUTHENTICATION: >-
        [{mechanism = password_based, backend = http, method = post,
          url = "http://getproperty-api:3000/internal/emqx/authn",
          headers {"content-type" = "application/json", "x-emqx-auth-token" = "${GETPROPERTY_EMQX_AUTH_TOKEN:-}"},
          body {transport = "ws", clientid = "$${clientid}", username = "$${username}", password = "$${password}",
                cert_common_name = "", cert_subject = "", peerhost = "$${peerhost}"},
          request_timeout = "5s", pool_size = 4}]
      EMQX_LISTENERS__WSS__DEFAULT__ENABLE: "false"
      # 1883 (global chain): password users in the built-in database, seeded from the bootstrap file on a fresh data dir
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME: sha256
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__SALT_POSITION: suffix
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: /opt/emqx/data/getproperty/users.json
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: plain
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: disconnect
      EMQX_AUTHORIZATION__CACHE__ENABLE: "true"
      EMQX_AUTHORIZATION__CACHE__TTL: 1m # a retired gateway loses its topics within a minute (the API also kicks it)
      EMQX_AUTHORIZATION__SOURCES: >-
        [{type = file, enable = true, path = "/opt/emqx/etc/platform-acl.conf"},
         {type = http, enable = true, method = post,
          url = "http://getproperty-api:3000/internal/emqx/authz",
          headers {"content-type" = "application/json", "x-emqx-auth-token" = "${GETPROPERTY_EMQX_AUTH_TOKEN:-}"},
          body {username = "$${username}", clientid = "$${clientid}", topic = "$${topic}", action = "$${action}",
                qos = "$${qos}", retain = "$${retain}", peerhost = "$${peerhost}"},
          request_timeout = "5s", pool_size = 8}]
      EMQX_PROMETHEUS__ENABLE: "true"
    volumes:
      - /data/emqx:/opt/emqx/data
      - ./emqx/platform-acl.conf:/opt/emqx/etc/platform-acl.conf:ro
    networks: [collective]
    expose: ["1883", "8083", "18083"]
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      options: { tag: "platform/emqx" }

  # ------------------------------------------------------------------ upload virus scan (shared)
  # One clamd for every product on the box (getproperty-api D-233 / blueprint T-2): INSTREAM on 3310, reachable only on
  # the `collective` network as platform-clamav-1:3310 (CLAMAV_HOST / CLAMAV_PORT in a product compose file). freshclam
  # runs inside the image and updates the signatures in /data/clamav. clamd.conf sets ConcurrentDatabaseReload no so a
  # signature reload does not hold two databases in memory (scans wait ~30-60 s during a reload instead); the steady
  # RSS of the full database is ≈ 1.0-1.1 GB (UNVERIFIED on the box — watch container_memory_working_set_bytes).
  clamav:
    image: clamav/clamav-debian:1.4
    restart: unless-stopped
    volumes:
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - /data/clamav:/var/lib/clamav
    networks: [collective]
    expose: ["3310"]
    deploy:
      resources:
        limits: { memory: "${CLAMAV_MEMORY_LIMIT:-1152m}" }
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s # first signature download on a fresh /data/clamav
    logging:
      options: { tag: "platform/clamav" }

  # ------------------------------------------------------------------ observability agent
  alloy:
    image: grafana/alloy:v1.11.0
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COLLECTIVE_ENV: ${COLLECTIVE_ENV}
      HOSTNAME_OVERRIDE: ${PLATFORM_HOSTNAME}
      GRAFANA_PROMETHEUS_URL: ${GRAFANA_PROMETHEUS_URL}
      GRAFANA_PROMETHEUS_USER: ${GRAFANA_PROMETHEUS_USER}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER}
      GRAFANA_TEMPO_URL: ${GRAFANA_TEMPO_URL}
      GRAFANA_TEMPO_USER: ${GRAFANA_TEMPO_USER}
      GRAFANA_API_KEY: ${GRAFANA_API_KEY}
      POSTGRES_EXPORTER_DSN: postgresql://postgres:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/postgres?sslmode=disable
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /data/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /proc:/host/proc:ro
    networks: [collective]
    expose: ["4317", "4318", "12345"] # OTLP gRPC/HTTP for app traces
    deploy:
      resources:
        limits: { memory: 384M }
    logging:
      options: { tag: "platform/alloy" }
