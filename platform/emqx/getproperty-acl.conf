%% EMQX file authorization source #1 (platform/docker-compose.yml). Evaluated before the PostgreSQL source #2,
%% which answers for gateways from getproperty's smart.mqtt_acl (one row per gateway certificate: publish
%% gp/v1/<gatewayId>/+ and …/cmd/ack, subscribe …/config and …/cmd — device protocol §1). No final deny here, or
%% source #2 would never be asked; authorization.no_match = deny closes the chain.

%% getproperty-api / worker / ingest on the internal listener (password, MQTT_USERNAME): the ingest shared
%% subscription, config / command publishing, health.
{allow, {username, "getproperty-api"}, all, ["gp/v1/+/#", "$share/ingest/gp/v1/+/#"]}.

%% Nobody else may subscribe to every gateway's topics or to $SYS.
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "gp/v1/#"}]}.
