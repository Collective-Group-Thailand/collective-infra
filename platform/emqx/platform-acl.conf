%% EMQX file authorization source #1 (platform/docker-compose.yml): platform-wide rules evaluated before the HTTP
%% source of getproperty-api (gateways and getproperty's service user on gp/v1/#, getproperty-api D-235). No final
%% rule here, or the HTTP source would never be asked; authorization.no_match = deny closes the chain.

%% Nobody may subscribe to every topic, to $SYS or to all of getproperty's namespace at once (the ingest service uses
%% the shared subscription $share/ingest/gp/v1/+/#, which the HTTP source allows for its user only).
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "gp/v1/#"}]}.
