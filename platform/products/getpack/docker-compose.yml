# getpack on the shared box. Deployed per component (api and web ship from separate repos):
#   bin/deploy-product.sh getpack api <tag>   → api, worker (+ migrate one-shot)
#   bin/deploy-product.sh getpack web <tag>   → web
# Env files (compose_product in bin/lib.sh): /etc/collective/platform.env
#   + /var/lib/collective/getpack.env        (API_TAG / WEB_TAG, written by deploy-product.sh)
#   + /var/lib/collective/getpack.hosts.env  (WEB_HOST / ADMIN_HOST / PARTNER_HOST / API_HOST, from render-sites.sh)
# App secrets (api + worker only): /run/collective/getpack.env, rendered from Secrets Manager collective/<env>/getpack/app
#
# Memory budget (16 GB box): web 512M · api 1.5G · worker 2G (Chromium) · migrate/scripts 1.5G transient
# NODE_OPTIONS sets the V8 heap explicitly: Node's default (≈half the cgroup limit) OOM-killed the api at ~315 MB.
name: getpack

networks:
  collective:
    external: true

x-api-base: &api-base
  image: ${ECR_REGISTRY}/getpack/api:${API_TAG:-none}
  env_file: /run/collective/getpack.env
  networks: [collective]
  restart: unless-stopped
  init: false # image already uses tini

services:
  web:
    image: ${ECR_REGISTRY}/getpack/web:${WEB_TAG:-none}
    container_name: getpack-web
    # No app secrets: the web tier holds no keys (ADR-0005 — the BFF talks to getpack-api over the docker network)
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: Asia/Bangkok
      PUBLIC_HOST: ${WEB_HOST:?run bin/render-sites.sh}
      ADMIN_HOST: ${ADMIN_HOST:?run bin/render-sites.sh}
      PARTNER_HOST: ${PARTNER_HOST:?run bin/render-sites.sh}
      API_INTERNAL_URL: http://getpack-api:3000
      TRUSTED_PROXY_HOPS: "1" # Caddy
      SENTRY_ENVIRONMENT: ${COLLECTIVE_ENV}
    networks: [collective]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      # Unknown Host headers are refused by src/proxy.ts, so any non-5xx answer proves the server is up
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    <<: *api-base
    container_name: getpack-api
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: Asia/Bangkok
      OTEL_EXPORTER_OTLP_ENDPOINT: http://platform-alloy-1:4318
      OTEL_SERVICE_NAME: getpack-api
      CLAMAV_HOST: clamav # platform clamd; uploads stay pending without it
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: collective-${COLLECTIVE_ENV}-getpack-assets
      NODE_OPTIONS: --max-old-space-size=1024
    deploy:
      resources:
        limits: { memory: 1536M }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # BullMQ consumers, outbox relay, PDFs (Chromium) — the only Chromium on the box by design. Consumer of the shared
  # `pdf-render` queue once getpack implements it (getproperty-api docs/pdf-render-queue.md §6): PDF_RENDER_REDIS_URL
  # in getpack/app = getpack's Valkey host and password with logical DB 15 (bin/lib.sh PLATFORM_QUEUES_VALKEY_DB),
  # prefix `collective`; S3 Get/Put on collective-<env>-<producer>-assets/tmp/pdf-render/* (Terraform
  # products.getpack.pdf_render_producers).
  # No HTTP server, so no healthcheck: restart policy covers crashes; queue depth is watched in Grafana.
  worker:
    <<: *api-base
    container_name: getpack-worker
    command: ["node", "dist/src/worker.js"]
    environment:
      NODE_ENV: production
      TZ: Asia/Bangkok
      OTEL_EXPORTER_OTLP_ENDPOINT: http://platform-alloy-1:4318
      OTEL_SERVICE_NAME: getpack-worker
      CLAMAV_HOST: clamav # platform clamd; uploads stay pending without it
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: collective-${COLLECTIVE_ENV}-getpack-assets
      WORKER_CONCURRENCY: "4"
      PDF_CONCURRENCY: "2"
      NODE_OPTIONS: --max-old-space-size=1280 # leaves ~700 MB of the 2G for Chromium
    shm_size: 256m # Chromium
    deploy:
      resources:
        limits: { memory: 2G }

  # One-shot: `prisma migrate deploy` (Prisma CLI bundled at /opt/prisma-cli in the api image).
  # Not started by `up` (profile); run by deploy-product.sh before api/worker are replaced.
  # Also the runner for one-off scripts on the box (seeds, photo imports):
  #   compose_product getpack run --rm --no-deps migrate node dist/scripts/<script>.js …
  migrate:
    <<: *api-base
    command: ["/opt/prisma-cli/node_modules/.bin/prisma", "migrate", "deploy", "--config", "/opt/prisma-cli/prisma.config.ts"]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1024 # scripts boot the whole AppModule
      TZ: Asia/Bangkok
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: collective-${COLLECTIVE_ENV}-getpack-assets
      CLAMAV_HOST: clamav
    restart: "no"
    profiles: ["tools"]
    deploy:
      resources:
        limits: { memory: 1536M }
