# getproperty on the shared box. Deployed with: bin/deploy-product.sh getproperty <tag> [--component web|liff]
# Env files (merged by compose_product in bin/lib.sh): /etc/collective/platform.env + /var/lib/collective/getproperty.env
# (IMAGE_TAG = getproperty-api's tag; WEB_IMAGE_TAG / LIFF_IMAGE_TAG = the tags of the two front-end repos, which
# deploy with --component — until their first deploy they run the env's moving tag :uat / :prod).
# App secrets: /run/collective/getproperty.env (rendered from Secrets Manager collective/<env>/getproperty/app;
# the keys are listed in getproperty-api docs/deployment.md §3 — the app does not call Secrets Manager itself).
#
# Images (getproperty-api docs/deployment.md §2): one api image, four commands — main (:3000 /health /metrics),
# worker (:3001), ingest (:3001 in its own container, INGEST_HEALTH_PORT — image contract, T-10), migrate (one-shot:
# asset-core core schema → prisma/migrations → TimescaleDB step → reference seed). The image's entrypoint runs the
# given command, so `command:` below is authoritative.
#
# Memory budget (locked 2026-10-21: getproperty ≈ 1.8 GB on the 16 GB prod box; getproperty-api D-233, T-11):
#   api 512M · worker 512M · ingest 192M · web 384M · liff 192M = 1,792 MB   (migrate 512M one-shot, not steady state)
# Interim (getproperty O-015, resolved 2026-10-21 as recommended; getproperty-api D-236 + ADR-0012): until getpack's
# shared `pdf-render` consumer is deployed, getproperty renders its PDFs with its own Chromium in the worker, which
# then gets 1.5 GB — GETPROPERTY_WORKER_MEMORY (default 1536M below) → getproperty = 2,816 MB. When the queue is live:
# set GETPROPERTY_PDF_RENDERER_MODE=queue and GETPROPERTY_WORKER_MEMORY=512M in platform/env/<env>.env, then make 512M
# the default here and drop shm_size. ClamAV is the platform's shared service (T-2, counted in the platform's ≈ 6 GB).
# uat (t4g.large, 8 GB) runs the same limits (UAT proves them under load); every project's ceilings together exceed
# 8 GB there, accepted because limits are ceilings, not reservations (platform/env/uat.env sizes PostgreSQL down).
name: getproperty

networks:
  collective:
    external: true

# Settings every api-image container shares. NOTE: a service's own `environment:` replaces this map (YAML merge is
# shallow), so every service repeats the anchor below with `<<: *api-env` instead of redefining it.
x-api-env: &api-env
  NODE_ENV: production
  TZ: Asia/Bangkok
  APP_ENV: ${COLLECTIVE_ENV}
  INTEGRATIONS_MODE: real
  DATA_STORES_MODE: real
  OTEL_EXPORTER_OTLP_ENDPOINT: http://platform-alloy-1:4318
  OTEL_SERVICE_NAMESPACE: getproperty
  AWS_REGION: ${AWS_REGION}
  S3_BUCKET: collective-${COLLECTIVE_ENV}-getproperty-assets
  S3_FORCE_PATH_STYLE: "false"
  # The box renders collective/<env>/getproperty/app into the env file; the app must not read it again.
  AWS_SECRETS_ID: ""
  # EMQX inside the docker network (plain MQTT on the internal listener; devices use the mTLS listener)
  MQTT_URL: mqtt://platform-emqx-1:1883
  MQTT_PROTOCOL_VERSION: "5"
  MQTT_SHARED_SUBSCRIPTION: "true"
  # Client IP (D-229): Caddy is the one proxy that appends X-Forwarded-For (it replaces the header of untrusted
  # clients); the BFFs reach the API over the `collective` network (daemon.json pool 172.30.0.0/16).
  TRUST_PROXY: "1"
  TRUSTED_PROXY_CIDRS: 172.30.0.0/16
  METRICS_ALLOWED_CIDRS: 172.30.0.0/16,127.0.0.0/8
  # Gateways' mTLS on /v1/device/*: Caddy verifies the certificate on DEVICE_HOST and forwards its SHA-256.
  DEVICE_MTLS_SOURCE: sha256_header
  DEVICE_MTLS_HEADER: x-client-cert-sha256
  # PDFs: `real` = the image's own Chromium (interim, O-015); `queue` = the shared pdf-render queue (T-1, D-236)
  PDF_RENDERER_MODE: ${GETPROPERTY_PDF_RENDERER_MODE:-real}
  PDF_CHROMIUM_EXECUTABLE: /usr/bin/chromium
  # Per-merchant / per-tenant provider credentials the app reads from Secrets Manager at run time — under the
  # product's prefix, which is all the instance role may read (modules/product IAM). Transitional: getproperty O-013
  # (resolved 2026-10-21 as recommended) moves them into PostgreSQL under the tenant data key; these three lines go
  # when getproperty-api ships that, leaving only collective/<env>/getproperty/app.
  PAYMENTS_SECRETS_PREFIX: collective/${COLLECTIVE_ENV}/getproperty/payments
  LOCKS_SECRETS_PREFIX: collective/${COLLECTIVE_ENV}/getproperty/locks
  ETAX_SECRETS_PREFIX: collective/${COLLECTIVE_ENV}/getproperty/etax
  # Upload virus scan (required in production): the platform's shared clamd (platform/docker-compose.yml, T-2)
  CLAMAV_HOST: platform-clamav-1
  CLAMAV_PORT: "3310"

x-api-base: &api-base
  image: ${ECR_REGISTRY}/getproperty/api:${IMAGE_TAG}
  env_file: /run/collective/getproperty.env
  networks: [collective]
  restart: unless-stopped
  init: false # the image already uses tini

services:
  # Owner console, staff PWA, platform admin (one Next.js app, host-based zones)
  web:
    image: ${ECR_REGISTRY}/getproperty/web:${WEB_IMAGE_TAG:-${COLLECTIVE_ENV}}
    container_name: getproperty-web
    env_file: /run/collective/getproperty-web.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: Asia/Bangkok
      API_INTERNAL_URL: http://getproperty-api:3000 # server-side BFF → API over the docker network
      TRUSTED_HOPS: "1" # Caddy appends one X-Forwarded-For entry (it drops the header of untrusted clients)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://platform-alloy-1:4318
      OTEL_SERVICE_NAME: getproperty-web
    networks: [collective]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 384M }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      collective.metrics: "true"
      collective.metrics.port: "3000"
      collective.metrics.path: "/api/metrics"

  # Resident LINE Mini App (LIFF) + technicians / landlords — getproperty-liff
  liff:
    image: ${ECR_REGISTRY}/getproperty/liff:${LIFF_IMAGE_TAG:-${COLLECTIVE_ENV}}
    container_name: getproperty-liff
    env_file: /run/collective/getproperty-liff.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: Asia/Bangkok
      API_INTERNAL_URL: http://getproperty-api:3000
      TRUSTED_HOPS: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://platform-alloy-1:4318
      OTEL_SERVICE_NAME: getproperty-liff
    networks: [collective]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 192M }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      collective.metrics: "true"
      collective.metrics.port: "3000"
      collective.metrics.path: "/api/metrics"

  api:
    <<: *api-base
    container_name: getproperty-api
    command: ["node", "dist/src/main.js"]
    environment:
      <<: *api-env
      PORT: "3000"
      OTEL_SERVICE_NAME: getproperty-api
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      collective.metrics: "true"
      collective.metrics.port: "3000"
      collective.metrics.path: "/metrics"

  # BullMQ: outbox relay + subscribers, billing cycles, notifications, documents (PDFs: own Chromium until
  # pdf-render), workflow timers
  worker:
    <<: *api-base
    container_name: getproperty-worker
    command: ["node", "dist/src/worker.js"]
    environment:
      <<: *api-env
      WORKER_HEALTH_PORT: "3001"
      OTEL_SERVICE_NAME: getproperty-worker
    shm_size: 256m # Chromium (interim, O-015)
    deploy:
      resources:
        # O-015 interim (own Chromium, ADR-0012 in getproperty-api): 1.5 GB; 512M once PDF_RENDERER_MODE=queue
        limits: { memory: "${GETPROPERTY_WORKER_MEMORY:-1536M}" }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      collective.metrics: "true"
      collective.metrics.port: "3001"
      collective.metrics.path: "/metrics"

  # MQTT shared subscription on EMQX → telemetry, health, readings (smart meters). Exactly one replica on the box.
  ingest:
    <<: *api-base
    container_name: getproperty-ingest
    command: ["node", "dist/src/ingest.js"]
    environment:
      <<: *api-env
      INGEST_HEALTH_PORT: "3001" # image contract: worker-type health on :3001 (own container, T-10)
      OTEL_SERVICE_NAME: getproperty-ingest
      MQTT_CLIENT_ID_PREFIX: getproperty-ingest
    deploy:
      resources:
        limits: { memory: 192M }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      collective.metrics: "true"
      collective.metrics.port: "3001"
      collective.metrics.path: "/metrics"

  # One-shot, run by deploy-product.sh before `up` (profile, never started by `up`). Not `npx prisma migrate deploy`:
  # getproperty's `core` schema comes from @collective/asset-core and must migrate first; the image's runner applies
  # it, then prisma/migrations (recorded in _prisma_migrations exactly like Prisma), then the optional TimescaleDB
  # step (D-162), then the idempotent reference seed (SEED_REFERENCE) — no Prisma CLI in the image. It runs as the
  # NOCREATEROLE product login (roles from postgres/init/20-getproperty.sh).
  migrate:
    <<: *api-base
    command: ["node", "dist/src/migrate.js"]
    environment:
      <<: *api-env
      TIMESCALEDB_MIGRATION: auto
      SEED_REFERENCE: "true"
      OTEL_SERVICE_NAME: getproperty-migrate
    restart: "no"
    profiles: ["tools"]
    deploy:
      resources:
        limits: { memory: 512M }
