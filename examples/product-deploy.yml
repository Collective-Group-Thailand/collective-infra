# Copy to <product-repo>/.github/workflows/deploy.yml and replace ORG / IMAGE / PRODUCT.
# main → build :sha-… + :uat → deploy UAT · tag v*.*.* → build :prod → deploy production (approval gate)
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build-uat:
    if: github.ref == 'refs/heads/main'
    uses: ORG/collective-infra/.github/workflows/reusable-build-push.yml@v1
    with:
      image: PRODUCT/api          # e.g. getpack/api
      environment: uat
      moving_tag: uat
      # build_args: |
      #   NEXT_PUBLIC_API_URL=https://uat-api.getpack.co

  deploy-uat:
    needs: build-uat
    uses: ORG/collective-infra/.github/workflows/reusable-deploy.yml@v1
    with:
      product: PRODUCT            # e.g. getpack
      environment: uat
      image_tag: ${{ needs.build-uat.outputs.image_tag }}

  build-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ORG/collective-infra/.github/workflows/reusable-build-push.yml@v1
    with:
      image: PRODUCT/api
      environment: production
      moving_tag: prod

  deploy-prod:
    needs: build-prod
    uses: ORG/collective-infra/.github/workflows/reusable-deploy.yml@v1
    with:
      product: PRODUCT
      environment: production
      image_tag: ${{ needs.build-prod.outputs.image_tag }}
