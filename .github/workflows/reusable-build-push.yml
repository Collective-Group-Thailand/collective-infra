name: Reusable · build arm64 image → ECR

# Called by product repos. Builds the Dockerfile natively on an arm64 runner, pushes
# :sha-<short> and the moving tag for the target env (:uat on main, :prod on release).

on:
  workflow_call:
    inputs:
      image:
        description: "ECR repo name, e.g. getpack/api"
        type: string
        required: true
      environment:
        description: "GitHub Environment whose deploy role may push: uat | production"
        type: string
        required: true
      moving_tag:
        description: "uat | prod"
        type: string
        required: true
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "Dockerfile"
      build_args:
        description: "Newline-separated KEY=value (e.g. NEXT_PUBLIC_API_URL=https://…)"
        type: string
        default: ""
      runner:
        description: "ubuntu-24.04-arm (GitHub-hosted arm64) or a self-hosted label"
        type: string
        default: "ubuntu-24.04-arm"
      extra_repository:
        description: "Optional second checkout (owner/name), e.g. a sibling package the Dockerfile builds from"
        type: string
        default: ""
      extra_ref:
        type: string
        default: ""
      extra_path:
        description: "Where the second checkout goes, inside the workspace (keep it out of the image via .dockerignore)"
        type: string
        default: ".extra"
      build_contexts:
        description: "Newline-separated name=path named build contexts (docker build --build-context)"
        type: string
        default: ""
    secrets:
      extra_repository_token:
        description: "Read token for extra_repository when it is private (until it is published as a package)"
        required: false
    outputs:
      image_tag:
        value: ${{ jobs.build.outputs.image_tag }}

permissions:
  id-token: write
  contents: read
  packages: read # @getpack/dieline from GitHub Packages

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        if: inputs.extra_repository != ''
        with:
          repository: ${{ inputs.extra_repository }}
          ref: ${{ inputs.extra_ref }}
          path: ${{ inputs.extra_path }}
          token: ${{ secrets.extra_repository_token || github.token }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-7' }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - id: meta
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "registry=${{ steps.ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.registry }}/${{ inputs.image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.registry }}/${{ inputs.image }}:${{ inputs.moving_tag }}
          build-args: |
            ${{ inputs.build_args }}
          build-contexts: |
            ${{ inputs.build_contexts }}
          secrets: |
            NODE_AUTH_TOKEN=${{ github.token }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.registry }}/${{ inputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.registry }}/${{ inputs.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
