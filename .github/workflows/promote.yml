name: Promote image uat → prod

# Re-tag one image currently deployed to UAT (or an explicit sha tag) as :prod and deploy it to
# production. No rebuild: the bytes that passed UAT are the bytes that ship. Approval gate = the
# `production` GitHub Environment.
#
# One component per run (each image ships from its own repo, so each has its own sha tag): getpack api | web,
# getproperty api | web | liff, getbuild api. `api` runs the migration first. getproperty's front ends read every
# environment value at run time (getproperty-web ADR-0009, getproperty-liff ADR-0007), so their UAT image is promotable;
# getpack-web is not (NEXT_PUBLIC_* baked at build — see the note at the end).

on:
  workflow_dispatch:
    inputs:
      product:
        type: choice
        options: [getpack, getproperty, getbuild]
        required: true
      component:
        type: choice
        options: [api, web, liff]
        required: true
      image_tag:
        description: "sha-xxxxxxx to promote (leave empty = whatever :uat points at)"
        type: string
        default: ""
      migrate:
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  retag:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
      - id: tag
        env:
          PRODUCT: ${{ inputs.product }}
          COMPONENT: ${{ inputs.component }}
          WANT: ${{ inputs.image_tag }}
        run: |
          img="$PRODUCT/$COMPONENT"
          tag="$WANT"
          if [ -z "$tag" ]; then
            # resolve :uat → its sha-* sibling tag
            tag=$(aws ecr describe-images --repository-name "$img" --image-ids imageTag=uat \
                    --query 'imageDetails[0].imageTags[?starts_with(@, `sha-`)] | [0]' --output text)
          fi
          manifest=$(aws ecr batch-get-image --repository-name "$img" --image-ids imageTag="$tag" \
                       --query 'images[0].imageManifest' --output text)
          [ "$manifest" != "None" ] || { echo "$img:$tag not found"; exit 1; }
          aws ecr put-image --repository-name "$img" --image-tag prod --image-manifest "$manifest" >/dev/null \
            || echo "$img:prod already points at $tag"
          echo "$img: $tag → prod"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    needs: retag
    uses: ./.github/workflows/reusable-deploy.yml # same repo → relative path is fine here
    with:
      product: ${{ inputs.product }}
      component: ${{ inputs.component }}
      environment: production
      image_tag: ${{ needs.retag.outputs.tag }}
      migrate: ${{ inputs.migrate }}

# NOTE (web): Next.js inlines NEXT_PUBLIC_* at build time, so a web image built for UAT carries UAT
# public values (e.g. NEXT_PUBLIC_ENV_BADGE=uat). Promote web only once its public env is identical
# across envs; until then build the production web image from a release tag with production build args.
